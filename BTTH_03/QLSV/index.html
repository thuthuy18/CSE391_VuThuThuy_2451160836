<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>

</head>
<body>

    <h1>QUẢN LÝ SINH VIÊN</h1>

    <button id="openModalBtn">
        Thêm sinh viên
    </button>

    <!-- Khu vực thống kê -->
    <div class="statistics">
        <p>Tổng sinh viên: <span id="totalStudents">0</span></p>
        <p>Điểm trung bình lớp: <span id="averageScore">0</span></p>
    </div>

    <!-- Khu vực thông báo -->
    <div id="message"></div>

    <!-- Bảng -->
    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Lớp</th>
                <th>Điểm TB</th>
                <th>Email</th>
                <th>Hành động</th>
            </tr>
        </thead>

        <tbody id="studentList">

        </tbody>
    </table>

<!-- Popup form -->
<div id="studentFormModal" class="modal hidden">
  <form id="studentForm">
    <h2 id="formTitle">Thêm sinh viên</h2>

    <label for="studentId">Mã sinh viên</label>
    <input id="studentId" required>

    <label for="studentName">Họ và tên</label>
    <input id="studentName" required>

    <label for="studentDob">Ngày sinh</label>
    <input id="studentDob" type="date" required>

    <label for="studentClass">Lớp học</label>
    <input id="studentClass" required>

    <label for="studentScore">Điểm trung bình</label>
    <input id="studentScore" type="number" step="0.1" required>

    <label for="studentEmail">Email</label>
    <input id="studentEmail" type="email" required>

    <button type="submit">Lưu</button>
    <button type="button" id="btnClose">Đóng</button>
  </form>
</div>

</body>
</html>
