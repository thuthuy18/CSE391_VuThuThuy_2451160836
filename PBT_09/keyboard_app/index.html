<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Keyboard App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <h1>Keyboard Accessibility App</h1>

        <button id="openPalette"
                aria-label="Open command palette">

            Ctrl + K

        </button>

    </header>

    <!-- =========================
         GALLERY
    ========================== -->

    <main class="gallery-section">

        <div class="gallery-container">

            <img id="galleryImage"
                 src="https://placehold.co/900x500?text=Image+1"
                 alt="Gallery Image">

            <div class="gallery-controls">

                <button id="prevBtn"
                        aria-label="Previous image">

                    ← Prev

                </button>

                <button id="playBtn"
                        aria-label="Play slideshow">

                    ▶ Play

                </button>

                <button id="nextBtn"
                        aria-label="Next image">

                    Next →

                </button>

            </div>

            <div class="hint">

                ← → : Navigate |
                1-9 : Jump Image |
                Space : Play/Pause |
                Esc : Close Modal

            </div>

        </div>

    </main>

    <!-- =========================
         IMAGE MODAL
    ========================== -->

    <div class="modal hidden"
         id="imageModal">

        <div class="modal-content">

            <img id="modalImage"
                 src=""
                 alt="Modal Image">

        </div>

    </div>

    <!-- =========================
         COMMAND PALETTE
    ========================== -->

    <div class="palette hidden"
         id="palette">

        <div class="palette-box">

            <input
                type="text"
                id="commandInput"
                placeholder="Type a command..."
                aria-label="Command search"
            >

            <ul id="commandList"></ul>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
