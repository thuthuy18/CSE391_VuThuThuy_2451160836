<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Form Validator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <form id="registerForm">

            <h1>Đăng kí tài khoản</h1>

            <!-- NAME -->

            <div class="form-group">

                <label>Name</label>

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <span id="nameIcon"></span>

                </div>

                <small class="error"
                       id="nameError"></small>

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <small class="error"
                       id="emailError"></small>

            </div>

            <!-- PASSWORD -->

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

                <div class="strength">

                    <div id="strengthBar"></div>

                </div>

                <small id="strengthText"></small>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                >

                <small class="error"
                       id="confirmError"></small>

            </div>

            <!-- PHONE -->

            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="0901-234-567"
                    maxlength="13"
                >

                <small class="error"
                       id="phoneError"></small>

            </div>

            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitBtn"
                disabled
            >
                Register
            </button>

        </form>

    </div>

    <!-- MODAL -->

    <div class="modal hidden"
         id="successModal">

        <div class="modal-content">

            <h2>Đăng ký thành công!</h2>

            <div id="userInfo"></div>

            <button id="closeModal">
                Close
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
