<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CSS Animations</title>

  <link rel="stylesheet" href="animations.css"/>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>TechStore Animation Effects</h1>
  </header>

  <!-- LOADING SPINNER -->
  <section class="loading-section">

    <h2>Loading Spinner</h2>

    <div class="spinner"></div>

  </section>

  <!-- PRODUCTS -->
  <div class="products">

    <!-- CARD 1 -->
    <div class="card fade-in">

      <div class="image-container">
        <img src="https://picsum.photos/300/220?1" alt="Laptop">
      </div>

      <div class="content">
        <h3>Lenovo Legion 5</h3>

        <p class="price">28.990.000đ</p>

        <button>Mua ngay</button>
      </div>

    </div>

    <!-- CARD 2 -->
    <div class="card fade-in">

      <div class="image-container">
        <img src="https://picsum.photos/300/220?2" alt="Laptop">
      </div>

      <div class="content">
        <h3>ASUS ROG Strix</h3>

        <p class="price">32.500.000đ</p>

        <button>Mua ngay</button>
      </div>

    </div>

    <!-- CARD 3 -->
    <div class="card fade-in">

      <div class="image-container">
        <img src="https://picsum.photos/300/220?3" alt="Laptop">
      </div>

      <div class="content">
        <h3>Dell XPS 15</h3>

        <p class="price">41.200.000đ</p>

        <button>Mua ngay</button>
      </div>

    </div>

    <!-- CARD 4 -->
    <div class="card fade-in">

      <div class="image-container">
        <img src="https://picsum.photos/300/220?4" alt="Laptop">
      </div>

      <div class="content">
        <h3>Acer Nitro 5</h3>

        <p class="price">24.990.000đ</p>

        <button>Mua ngay</button>
      </div>

    </div>

   </div>

</body>
</html>
